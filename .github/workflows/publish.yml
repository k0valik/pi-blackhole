name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # npm provenance attestations (OIDC)
  contents: read

jobs:
  publish:
    if: github.repository == 'k0valik/pi-blackhole'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm pack --dry-run --json --ignore-scripts | node scripts/check-tarball.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm format:check
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

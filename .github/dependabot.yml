version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns:
          - "*"
    # TypeScript stays at 6.0.3: @typescript-eslint v8 does not support TS 7+,
    # and an unattended bump breaks `pnpm lint` (see AGENTS.md).
    ignore:
      - dependency-name: "typescript"
